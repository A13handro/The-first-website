{{ define "posts" }}
{{ template "header" }}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница добавления поста</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://getbootstrap.com/docs/5.3/examples/cover/cover.css">
</head>
<header class="mb-auto">
    <div>
        <h3 class="float-md-start mb-0"><ya-tr-span style="visibility: inherit !important;">Vibe-Web</ya-tr-span>
        </h3>
        <nav class="nav nav-masthead justify-content-center float-md-end"> <a class="nav-link fw-bold py-1 px-0"
                aria-current="page" href="/api"><ya-tr-span
                    style="visibility: inherit !important;">Главная</ya-tr-span></a> <a
                class="nav-link fw-bold py-1 px-0 active" href="/api/posts"><ya-tr-span
                    style="visibility: inherit !important;">Добавить пост</ya-tr-span></a>
        </nav>
    </div>
</header>
<main class="px-3">
    <h1><ya-tr-span data-index="3-0">Форма создания поста</ya-tr-span></h1>
    <form action="/api/pos" method="post" enctype="multipart/form-data">
        <input type="text" name="a" id="a" placeholder="" value="/api/posts" style="display: none;">
        <input type="file" name="file" placeholder="Выберите файл" class="form-control"><br>
        <div class="form-check text-start my-3"> <input class="form-check-input" type="checkbox" value="true"
                id="toggle" name="pict">
            <label class="form-check-label" for="pict"><ya-tr-span style="visibility: inherit !important;"> Без картинки
                </ya-tr-span></label>
        </div>
        <input type="text" name="title" id="title" placeholder="Введите название статьи" class="form-control"><br>
        <textarea rows="10" name="content" id="content" class="form-control"
            placeholder="Введите текст статьи"></textarea><br>
        {{if .}}
        <h6 id="messagee">{{.}}</h6>
        {{end}}
        <button class="btn btn-warning">Добавить</button>
        <script>
            setTimeout(function () {
                document.getElementById('messagee').remove();
            }, 5000);
        </script>
        <script>
            const checkbox = document.getElementById('toggle');
            const field = document.getElementById('Field');

            checkbox.addEventListener('change', () => {
                field.disabled = checkbox.checked;
            });
        </script>
    </form>
</main>

{{ template "footer" }}
{{ end }}
