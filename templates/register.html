{{ define "register" }}
{{ template "header" }}
<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://getbootstrap.com/docs/5.3/examples/cover/cover.css">
</head>
<header class="mb-auto">
    <div>
        <h3 class="float-md-start mb-0"><ya-tr-span style="visibility: inherit !important;">Vibe-Web</ya-tr-span>
        </h3>
        <nav class="nav nav-masthead justify-content-center float-md-end">
            <a class="nav-link fw-bold py-1 px-0" href="/api/auth/login"><ya-tr-span
                    style="visibility: inherit !important;">Авторизация</ya-tr-span>
            </a>
            <a class="nav-link fw-bold py-1 px-0 active" href="/api/auth/register"><ya-tr-span
                    style="visibility: inherit !important;">Регистрация</ya-tr-span>
            </a>
        </nav>
    </div>
</header>
<main class="form-signin w-100 m-auto">
    <div class="d-flex justify-content-center">
        <form action="/api/auth/reg" method="post">
            <img class="mb-4" src="https://i.pinimg.com/736x/65/94/c7/6594c70162b3bccac308ab682934b42e.jpg" alt=""
                width="200" height="150">
            <h1 class="h3 mb-3 fw-normal">Зарегистрируйтесь в системе</h1>
            <div class="form-floating"><input type="email" class="form-control" name="email" id="email"
                    placeholder="name@example.com" class="form-control"><label for="email">Email</label>
            </div>
            <div class="form-floating"><input type="password" name="password" id="password"
                    placeholder="Введите название статьи" class="form-control"><label for="password">Пароль</label>
            </div>
            <div class="form-floating"><input type="name" class="form-control" name="name" id="name"
                    placeholder="Введите имя" class="form-control"><label for="name">Имя</label>
            </div>
            <div class="form-floating"><input type="surname" name="surname" id="surname" placeholder="Введите фамилию"
                    class="form-control"><label for="surname">Фамилия</label>
            </div>
            <script>
                setTimeout(function () {
                    document.getElementById('messagee').remove();
                }, 5000);
            </script>
            <!-- <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" value="true" id="role" name="role">
                <label class="form-check-label" for="role"></label>
                <span class="text-muted">Читатель</span>
            </div> -->

            <div class="d-flex align-items-center justify-content-center gap-3 my-4">
                <span class="text-muted fw-normal">Читатель</span>
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="role" name="role">
                    <label class="form-check-label" for="roleToggle"></label>
                </div>
                <span class="fw-bold">Автор</span>
            </div>
            {{if .}}
            <h6 id="messagee">{{.}}</h6>
            {{end}}

            <button class="btn btn-warning">Зарегистрироваться</button>
        </form>
    </div>
</main>
<script src="/docs/5.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" class="astro-vvvwv3sm"></script>
</body>

</html>
{{ end }}
