{{ define "login" }}
{{ template "header" }}
<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://getbootstrap.com/docs/5.3/examples/cover/cover.css">
</head>
<header class="mb-auto">
    <div>
        <h3 class="float-md-start mb-0"><ya-tr-span style="visibility: inherit !important;">Vibe-Web</ya-tr-span>
        </h3>
        <nav class="nav nav-masthead justify-content-center float-md-end">
            <a class="nav-link fw-bold py-1 px-0 active" href="/api/auth/login"><ya-tr-span
                    style="visibility: inherit !important;">Авторизация</ya-tr-span>
            </a>
            <a class="nav-link fw-bold py-1 px-0" href="/api/auth/register"><ya-tr-span
                    style="visibility: inherit !important;">Регистрация</ya-tr-span>
            </a>
        </nav>
    </div>
</header>
<main class="form-signin w-100 m-auto">
    <div class="d-flex justify-content-center">
        <form action="/api/auth/log" method="post">
            <img class="mb-4"
                src="https://avatars.mds.yandex.net/i?id=efbcf89f7ce6c25a5cbaddd79fd135c3_l-4538573-images-thumbs&n=13"
                alt="" width="200" height="150">
            <h1 class="h3 mb-3 fw-normal">Войдите в систему</h1>
            <div class="form-floating"><input type="email" class="form-control" name="email" id="email"
                    placeholder="Введите логин" class="form-control"><label for="email">Логин</label></div>
            <div class="form-floating"><input type="password" name="password" id="password"
                    placeholder="Введите название статьи" class="form-control"><label for="password">Пароль</label><br>
            </div>
            {{if .}}
            <h6 id="messagee">{{.}}</h6>
            {{end}}
            <script>
                setTimeout(function () {
                    document.getElementById('messagee').remove();
                }, 5000);
            </script>
            <button class="btn btn-warning">Войти</button>
        </form>
    </div>
</main>
<script src="/docs/5.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" class="astro-vvvwv3sm"></script>
</body>

</html>
{{ end }}
