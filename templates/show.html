{{define "show"}}
{{template "header"}}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пост: {{.Title}}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://getbootstrap.com/docs/5.3/examples/cover/cover.css">
</head>
<header class="mb-auto">
    <div>
        <h3 class="float-md-start mb-0"><ya-tr-span style="visibility: inherit !important;">Vibe-Web</ya-tr-span>
        </h3>
        <nav class="nav nav-masthead justify-content-center float-md-end"> <a class="nav-link fw-bold py-1 px-0"
                aria-current="page" href="/api"><ya-tr-span
                    style="visibility: inherit !important;">Главная</ya-tr-span></a> <a
                class="nav-link fw-bold py-1 px-0" href="/api/posts"><ya-tr-span
                    style="visibility: inherit !important;">Добавить пост</ya-tr-span></a>
        </nav>
    </div>
</header>
<main class="px-3">
    <h1><ya-tr-span data-index="3-0">Редактирование поста</ya-tr-span></h1>
    <p>
    <form action="/api/pos" method="post" enctype="multipart/form-data">
        {{if and (ne .Images "s") (ne .Images "cw==")}}
        <img class="mb-4" src="data:image/*;base64,{{.Images}}" alt="Картинка" width="200" height="150">
        {{end}}
        <input type="text" name="id" id="id" placeholder="" value="{{.PostId}}" style="display: none;">
        <input type="text" name="a" id="a" placeholder="" value="/api/post/{{.PostId}}" style="display: none;"><br>
        <input type="file" name="file" placeholder="Выберите файл" class="form-control" id="Field" value="{{.Images}}">
        <div class="form-check text-start my-3"> <input class="form-check-input" type="checkbox" value="true"
                id="toggle" name="pict">
            <label class="form-check-label" for="pict"><ya-tr-span style="visibility: inherit !important;"> Без картинки
                </ya-tr-span></label>
        </div>
        <input type="text" name="title" id="title" placeholder="Введите название статьи" class="form-control"
            value="{{.Title}}"><br>
        <textarea rows="10" name="content" id="content" class="form-control"
            placeholder="Введите текст статьи">{{.Content}}</textarea><br>
        {{if .Mes}}
        <h6 id="messagee">{{.Mes}}</h6>
        {{end}}
        <script>
            setTimeout(function () {
                document.getElementById('messagee').remove();
            }, 5000);
        </script>
        <button class="btn btn-warning">Сохранить</button>
    </form>
    <script>
        const checkbox = document.getElementById('toggle');
        const field = document.getElementById('Field');

        checkbox.addEventListener('change', () => {
            field.disabled = checkbox.checked;
        });
    </script>
    </p>
    <p class="lead"><a href="/api" class="btn btn-lg btn-light fw-bold border-white bg-white">
            <ya-tr-span style="visibility: inherit !important;">Назад</ya-tr-span></a>
    </p>
    <p>
        <a href="/api/delete/{{.PostId}}" class="btn btn-danger">Пост гавно? Удалить?</a>
    </p>
</main>
{{template "footer"}}
{{end}}
