basePath: /api/v1
host: localhost:8080
info:
  contact:
    name: Александр
    url: https://vk.com/a13handro
  description: Сайт
  title: API на Go со Swagger
  version: "1.0"
paths:
  /api/auth/login:
    post:
      responses: {}
      summary: Авторизация
      tags:
      - Authorization
  /api/auth/refresh-token:
    post:
      description: метод вызывается автоматически из функции-оболочки (AuthMiddleware)
        при невалидном Accesstoken
      responses: {}
      summary: Обновление токена
      tags:
      - RefreshToken
  /api/auth/register:
    post:
      responses: {}
      summary: Регистрация
      tags:
      - Authorization
  /api/posts:
    get:
      description: Требует аутентификации.
      responses: {}
      summary: Просмотр постов
      tags:
      - Posts
    post:
      description: Требует аутентификации(Роль Автор).
      responses: {}
      summary: Создание поста
      tags:
      - Posts
  /api/posts/{postId}:
    put:
      description: Требует аутентификации(Роль Автор).
      responses: {}
      summary: Редактирование поста
      tags:
      - Posts
  /api/posts/{postId}/images:
    post:
      description: Требует аутентификации(Роль Автор).
      responses: {}
      summary: Добавление картинки к посту
      tags:
      - Image
  /api/posts/{postId}/images/{imageId}:
    delete:
      description: Требует аутентификации(Роль Автор).
      responses: {}
      summary: Удаление картинки из поста
      tags:
      - Image
  /api/posts/{postId}/status:
    patch:
      description: Требует аутентификации(Роль Автор).
      responses: {}
      summary: Публикация поста
      tags:
      - Posts
swagger: "2.0"
